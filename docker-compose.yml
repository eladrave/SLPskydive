version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skydiving-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=skydiving
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skydiving"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skydiving-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/skydiving
      - SECRET_KEY=a_very_secret_key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skydiving-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
