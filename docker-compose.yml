version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slpskydive
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/backend:/app/backend
      - ./app:/app/app
    ports:
      - "8000:8000"
    command: bash -lc "uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: .env
    depends_on:
      - backend
    working_dir: /app/frontend
    volumes:
      - ./app/frontend:/app/frontend
    ports:
      - "5173:5173"
    command: bash -lc "pnpm install && pnpm run dev --host"

volumes:
  db_data:
