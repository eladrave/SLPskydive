server {
  listen 5173;

  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri $uri/ /index.html;
  }

  # handle asset requests
  location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public";
  }
}
